# XcodeGen project spec.
# Run `xcodegen` in this directory to generate Tally.xcodeproj.
# Install once: brew install xcodegen
name: Tally
options:
  bundleIdPrefix: com.christylam
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    GENERATE_INFOPLIST_FILE: YES
    # Required by TestFlight / App Store Connect. MARKETING_VERSION becomes
    # CFBundleShortVersionString (1-3 dot-separated ints); CURRENT_PROJECT_VERSION
    # becomes CFBundleVersion (the build number — must increase each upload).
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait"
    # Portrait-only on both devices — the UI is phone-shaped. Setting
    # UIRequiresFullScreen lets us declare fewer than all four orientations
    # on iPad without Xcode warning; the trade-off is no Split View /
    # Slide Over multitasking on iPad.
    INFOPLIST_KEY_UIRequiresFullScreen: YES
    # Wakes the app for silent CloudKit pushes so friends' changes sync in the background.
    INFOPLIST_KEY_UIBackgroundModes: "remote-notification"
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  Tally:
    type: application
    platform: iOS
    sources:
      - path: Tally
    entitlements:
      path: Tally/Tally.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.christylam.tally
        com.apple.developer.icloud-services:
          - CloudKit
        # Required for CloudKit push subscriptions (live updates between friends).
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.christylam.tally
        PRODUCT_NAME: Tally
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        DEVELOPMENT_TEAM: 2UM67KP3T9

  TallyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TallyTests
    dependencies:
      - target: Tally
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.christylam.tally.tests
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: 2UM67KP3T9
